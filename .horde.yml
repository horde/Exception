---
id: Exception
name: Exception
full: Exception handler library
description: >-
  A library that provides the default exception handlers for the Horde
  Framework.
list: dev
type: library
homepage: https://www.horde.org/libraries/Horde_Exception
authors:
  - name: Jan Schneider
    user: jan
    email: jan@horde.org
    active: true
    role: lead
  - name: Chuck Hagenbuch
    user: chuck
    email: chuck@horde.org
    active: false
    role: lead
  - name: Michael Slusarz
    user: slusarz
    email: slusarz@horde.org
    active: false
    role: developer
version:
  release: 3.1.0
  api: 3.0.0alpha1
state:
  release: stable
  api: alpha
license:
  identifier: LGPL-2.1-only
  uri: http://www.horde.org/licenses/lgpl21
dependencies:
  required:
    php: ^7.4 || ^8
    composer:
      horde/translation: ^3
  dev:
    composer:
      horde/test: ^3
autoload:
  psr-0:
    Horde_Exception: lib/
  psr-4:
    Horde\Exception\: src/
  classmap:
    - compat/
vendor: horde
keywords:
  - framework
  - spl
  - pear_error
ci-platform:
  '8.0':
    - php: ^8.1
    - ext-dom
  '8.1':
    - php: ^8.1
    - ext-dom
  '8.2':
    - php: ^8.2
    - ext-dom
  '8.3':
    - php: ^8.3
    - ext-dom
  '8.4':
    - php: ^8.4
    - ext-dom
  '8.5':
    - php: ^8.5
    - ext-dom
  '8.6':
    - php: ^8.6
    - ext-dom
ci-platform-flags:
  needs_installer_plugin: false
